{
  "Dhcp4": {
    "client-classes": [
      {
        "boot-file-name": "http://$OPENCHAMI_BASE_IP:80/boot.ipxe",
        "name": "iPXE",
        "test": "substring(option[77].hex,0,4) == 'iPXE'"
      },
      {
        "boot-file-name": "undionly.kpxe",
        "name": "BIOS",
        "test": "option[93].hex == 0x0000"
      },
      {
        "boot-file-name": "ipxe.efi",
        "name": "UEFI-64",
        "test": "option[93].hex == 0x0007 or option[93].hex == 0x0009"
      }
    ],
    "control-sockets": [
      {
        "socket-address": "127.0.0.1",
        "socket-port": 8000,
        "socket-type": "http"
      }
    ],
    "hooks-libraries": [
      { "library": "/usr/local/lib/kea/hooks/libdhcp_pgsql.so" },
      { "library": "/usr/local/lib/kea/hooks/libdhcp_host_cmds.so" }
    ],
    "hosts-database": {
      "host": "localhost",
      "name": "kea",
      "password": "$KEA_DB_PASSWORD",
      "port": 15432,
      "type": "postgresql",
      "user": "kea-user"
    },
    "interfaces-config": {
      "interfaces": ["*"]
    },
    "lease-database": {
      "host": "localhost",
      "name": "kea",
      "password": "$KEA_DB_PASSWORD",
      "port": 15432,
      "type": "postgresql",
      "user": "kea-user"
    },
    "rebind-timer": 225,
    "renew-timer": 150,
    "subnet4": [
      {
        "id": 1,
        "option-data": [
          { "data": "$OPENCHAMI_GATEWAY", "name": "routers" },
          { "data": "8.8.8.8", "name": "domain-name-servers" },
          { "data": "$OPENCHAMI_BASE_IP", "name": "tftp-server-name" }
        ],
        "next-server": "$OPENCHAMI_BASE_IP",
        "pools": [
          { "pool": "$OPENCHAMI_POOL_START - $OPENCHAMI_POOL_END" }
        ],
        "subnet": "$OPENCHAMI_SUBNET"
      }
    ],
    "valid-lifetime": 300
  }
}
