{{- if .Values.httpServer.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ochami-helm.fullname" . }}-http-server-content
  labels:
    {{- include "ochami-helm.labels" . | nindent 4 }}
data:
  boot.ipxe: |-
    #!ipxe

    {{- $httpPort := int (.Values.httpServer.service.nodePort | default 30080) }}
    {{- $externalIp := .Values.externalIp | default "192.168.100.2" }}

    echo "=============================================="
    echo "OpenCHAMI Network Boot"
    echo "Server: {{ $externalIp }}:{{ $httpPort }}"
    echo "=============================================="

    set base-url http://{{ $externalIp }}:{{ $httpPort }}

    echo "Loading kernel..."
    kernel ${base-url}/artifacts/vmlinuz-lts console=ttyS0 ip=dhcp rd.neednet=1 root=live:${base-url}/artifacts/rootfs.squashfs

    echo "Loading initramfs..."
    initrd ${base-url}/artifacts/initramfs-lts

    echo "Booting..."
    boot
  index.html: |-
{{ .Files.Get "files/index.html" | indent 4 }}
  user-data: |-
    #cloud-config
    users:
      - name: local
        passwd: $6$rounds=4096$eaJ.A3/..$M8t.uM/..
        lock_passwd: false
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
    ssh_pwauth: true
    chpasswd:
      list: |
        local:linux
      expire: false
  meta-data: |-
    instance-id: i-local
    local-hostname: localhost
{{- end }}
