apiVersion: v1
kind: Service
metadata:
  name: {{ include "ochami-helm.fullname" . }}-tftp
  labels:
    {{- include "ochami-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: tftp
spec:
  type: ClusterIP
  ports:
    - port: 69
      protocol: UDP
      name: tftp
  selector:
    {{- include "ochami-helm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tftp
