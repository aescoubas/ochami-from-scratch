{{- if .Values.httpServer.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ochami-helm.fullname" . }}-http-server-config
  labels:
    {{- include "ochami-helm.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen       {{ .Values.httpServer.port }};
        listen  [::]:{{ .Values.httpServer.port }};
        server_name  localhost;

        # Proxy to BSS for dynamic boot scripts
        # This allows BSS to generate custom boot scripts per node
        
        # Handle requests prefixed with /apis/bss/ (rewrite/strip prefix)
        location /apis/bss/ {
            proxy_pass http://ochami-bss.{{ .Release.Namespace }}.svc.cluster.local:27778/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Handle direct requests to /boot/v1/
        location /boot/v1/ {
            proxy_pass http://ochami-bss.{{ .Release.Namespace }}.svc.cluster.local:27778/boot/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy to SMD
        location /hsm/ {
            proxy_pass http://{{ include "ochami-helm.fullname" . }}-smd.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.smd.port }}/hsm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy to PCS (Power Control Service)
        location /power-control/ {
            proxy_pass http://ochami-pcs.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.pcs.port }}/power-control/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy to cloud-init service
        location /cloud-init/ {
            proxy_pass http://ochami-cloud-init.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.cloudInit.port }}/cloud-init/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy to Stork (Kea DHCP Monitor)
        location /stork/ {
            proxy_pass http://ochami-stork-server.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.stork.port }}/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Stork API endpoint used by stork-agent when configured with proxy root URL
        location /api/ {
            proxy_pass http://ochami-stork-server.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.stork.port }}/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /hmi/v1/subscribe {
            return 200 '{"Components":[]}';
            add_header Content-Type application/json;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            autoindex on;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
{{- end }}
