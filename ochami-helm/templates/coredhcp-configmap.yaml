apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ochami-helm.fullname" . }}-coredhcp-config
  labels:
    {{- include "ochami-helm.labels" . | nindent 4 }}
data:
  config.yaml: |
{{- if .Values.coredhcp.customConfig }}
{{ tpl .Values.coredhcp.customConfig . | indent 4 }}
{{- else }}
    server4:
      listen: "0.0.0.0:67"
      plugins:
        #
        # Base CoreDHCP config
        #

        - server_id: {{ .Values.coredhcp.server_id | default .Values.externalIp | quote }}
        - dns: {{ .Values.coredhcp.dns | quote }}
        - router: {{ .Values.coredhcp.router | default .Values.externalIp | quote }}
        - netmask: {{ .Values.coredhcp.netmask | quote }}

        {{- $smdUrl := printf "http://%s-smd.%s.svc.cluster.local:%v" (include "ochami-helm.fullname" .) .Release.Namespace .Values.service.smd.port }}
        {{- $bootScriptUrl := .Values.bootScriptUrl | default (printf "http://%s:%v/boot.ipxe" .Values.externalIp (int (.Values.httpServer.service.nodePort | default 30080))) }}
        {{- $bootfile := "undionly.kpxe" }}
        {{- if .Values.coredhcp.nbp }}
        {{- $bootfile = .Values.coredhcp.nbp.bootfile | default "undionly.kpxe" }}
        {{- end }}

        #
        # Range plugin - simple IP allocation from a pool
        # Unlike bootloop, this doesn't send NAKs or have discovery features
        # Args: lease_file start_ip end_ip lease_time
        #
        - range: /tmp/coredhcp.leases {{ .Values.coredhcp.bootloop.ip_pool_start }} {{ .Values.coredhcp.bootloop.ip_pool_end }} {{ .Values.coredhcp.short_lease_time | default "10m" }}

        #
        # Network Boot Program (NBP) - specifies boot file for PXE clients
        # For raw PXE: serves TFTP path to iPXE binary
        # For iPXE: serves HTTP boot script URL
        # The nbp plugin is smart enough to serve the right format based on client
        #
        - nbp: "{{ $bootScriptUrl }}"
{{- end }}
