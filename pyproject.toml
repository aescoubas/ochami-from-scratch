[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ochami"
version = "0.1.0"
description = "OpenCHAMI orchestration CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.scripts]
ochami = "ochami.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["ochami*"]
