#cloud-config
write_files:
  - path: /etc/NetworkManager/conf.d/90-dns.conf
    content: |
      [global-dns]
      searches=cscs.ch
      [global-dns-domain-*]
      servers=148.187.3.88,148.187.18.88

bootcmd:
  - zypper --gpg-auto-import-keys refresh

runcmd:
  - nmcli general reload

package_update: true
packages:
  - jq
  - htop
