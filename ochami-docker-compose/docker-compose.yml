services:
  postgres:
    image: postgres:11.5-alpine
    network_mode: host
    command: ["postgres", "-p", "${POSTGRES_PORT:-5432}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ochami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_MULTIPLE_DATABASES: "${SMD_DB_NAME:-hmsds}:${SMD_DB_USER:-smd-user}:${SMD_DB_PASSWORD:?SMD_DB_PASSWORD is required},${BSS_DB_NAME:-bssdb}:${BSS_DB_USER:-bss-user}:${BSS_DB_PASSWORD:?BSS_DB_PASSWORD is required},${KEA_DB_NAME:-kea}:${KEA_DB_USER:-kea-user}:${KEA_DB_PASSWORD:?KEA_DB_PASSWORD is required},${PCS_DB_NAME:-pcsdb}:${PCS_DB_USER:-pcs-user}:${PCS_DB_PASSWORD:?PCS_DB_PASSWORD is required},${STORK_DB_NAME:-stork}:${STORK_DB_USER:-stork-user}:${STORK_DB_PASSWORD:?STORK_DB_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./pg-init/multi-psql-db.sh:/docker-entrypoint-initdb.d/multi-psql-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ochami} -p ${POSTGRES_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 30

  smd-init:
    image: localhost/smd:local-smd
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SMD_DBHOST: localhost
      SMD_DBPORT: ${POSTGRES_PORT:-5432}
      SMD_DBNAME: ${SMD_DB_NAME:-hmsds}
      SMD_DBUSER: ${SMD_DB_USER:-smd-user}
      SMD_DBPASS: ${SMD_DB_PASSWORD:?SMD_DB_PASSWORD is required}
      SMD_DBOPTS: "sslmode=disable"
    command: ["/smd-init"]
    restart: "no"

  smd:
    image: localhost/smd:local-smd
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      smd-init:
        condition: service_completed_successfully
    environment:
      SMD_DBHOST: localhost
      SMD_DBPORT: ${POSTGRES_PORT:-5432}
      SMD_DBNAME: ${SMD_DB_NAME:-hmsds}
      SMD_DBUSER: ${SMD_DB_USER:-smd-user}
      SMD_DBPASS: ${SMD_DB_PASSWORD:?SMD_DB_PASSWORD is required}
      SMD_DBOPTS: "sslmode=disable"
      SMD_JWKS_URL: ""
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${SMD_PORT:-27779}/hsm/v2/service/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  bss-init:
    image: localhost/bss:local-bss
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BSS_INSECURE: "true"
      BSS_DBHOST: localhost
      BSS_DBPORT: ${POSTGRES_PORT:-5432}
      BSS_DBNAME: ${BSS_DB_NAME:-bssdb}
      BSS_DBUSER: ${BSS_DB_USER:-bss-user}
      BSS_DBPASS: ${BSS_DB_PASSWORD:?BSS_DB_PASSWORD is required}
      BSS_DBOPTS: "sslmode=disable"
    command: ["/usr/local/bin/bss-init"]
    restart: "no"

  bss:
    image: localhost/bss:local-bss
    network_mode: host
    depends_on:
      smd:
        condition: service_healthy
      bss-init:
        condition: service_completed_successfully
    environment:
      HSM_URL: "http://localhost:${HTTP_PORT:-80}"
      BSS_INSECURE: "true"
      BSS_DEBUG: "true"
      BSS_DBHOST: localhost
      BSS_DBPORT: ${POSTGRES_PORT:-5432}
      BSS_DBNAME: ${BSS_DB_NAME:-bssdb}
      BSS_DBUSER: ${BSS_DB_USER:-bss-user}
      BSS_DBPASS: ${BSS_DB_PASSWORD:?BSS_DB_PASSWORD is required}
      BSS_DBOPTS: "sslmode=disable"
      BSS_JWKS_URL: ""
      BSS_IPXE_SERVER: ${HOST_IP:-192.168.100.2}
      BSS_CHAIN_PROTO: "http"
      BSS_ENDPOINT: "localhost"
      BSS_ADVERTISE_ADDRESS: ${HOST_IP:-192.168.100.2}
      NFD_URL: "http://${HOST_IP:-192.168.100.2}:${HTTP_PORT:-80}/hmi/v1/subscribe"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${BSS_PORT:-27778}/boot/v1/bootparameters || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  cloud-init:
    image: localhost/cloud-init:local-cloud-init
    network_mode: host
    depends_on:
      smd:
        condition: service_healthy
    command:
      - "/usr/local/bin/cloud-init-server"
      - "--listen"
      - "0.0.0.0:${CLOUD_INIT_PORT:-27777}"
      - "--smd-url"
      - "http://localhost:${HTTP_PORT:-80}"
      - "--cluster-name"
      - "ochami"
      - "--insecure"
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp sport = :${CLOUD_INIT_PORT:-27777} | grep -q ${CLOUD_INIT_PORT:-27777}"]
      interval: 5s
      timeout: 5s
      retries: 30

  power-control-init:
    image: localhost/pcs:local-pcs
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${PCS_DB_USER:-pcs-user}"
      POSTGRES_PASSWORD: "${PCS_DB_PASSWORD:?PCS_DB_PASSWORD is required}"
      POSTGRES_DBNAME: "${PCS_DB_NAME:-pcsdb}"
      POSTGRES_INSECURE: "true"
    command: ["power-control", "init-postgres"]
    restart: "no"

  power-control:
    image: localhost/pcs:local-pcs
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      smd:
        condition: service_healthy
      power-control-init:
        condition: service_completed_successfully
    environment:
      STORAGE: "POSTGRES"
      SMS_SERVER: "http://localhost:${HTTP_PORT:-80}"
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${PCS_DB_USER:-pcs-user}"
      POSTGRES_PASSWORD: "${PCS_DB_PASSWORD:?PCS_DB_PASSWORD is required}"
      POSTGRES_DBNAME: "${PCS_DB_NAME:-pcsdb}"
      POSTGRES_INSECURE: "true"
      TRS_IMPLEMENTATION: "LOCAL"
      HSMLOCK_ENABLED: "true"
      VAULT_ENABLED: "false"
      FAKE_VAULT_ENABLED: "false"
      LOG_LEVEL: "INFO"
    command: ["power-control", "--run-control"]

  kea-init:
    image: jonasal/kea-admin:3.1.4
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "db-init"
      - "pgsql"
      - "-h"
      - "localhost"
      - "-P"
      - "${POSTGRES_PORT:-5432}"
      - "-u"
      - "${KEA_DB_USER:-kea-user}"
      - "-p"
      - "${KEA_DB_PASSWORD:?KEA_DB_PASSWORD is required}"
      - "-n"
      - "${KEA_DB_NAME:-kea}"
    restart: "no"

  kea:
    image: jonasal/kea-dhcp4:3.1.4
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      kea-init:
        condition: service_completed_successfully
    volumes:
      - ./configs/kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
      - kea-run:/kea/sockets
    command: ["-c", "/etc/kea/kea-dhcp4.conf"]

  kea-sidecar:
    image: localhost/kea-sidecar:latest
    network_mode: host
    depends_on:
      smd:
        condition: service_healthy
      kea-init:
        condition: service_completed_successfully
    environment:
      SMD_URL: "http://localhost:${HTTP_PORT:-80}"
      DB_NAME: ${KEA_DB_NAME:-kea}
      DB_USER: ${KEA_DB_USER:-kea-user}
      DB_PASS: ${KEA_DB_PASSWORD:?KEA_DB_PASSWORD is required}
      DB_HOST: localhost
      DB_PORT: ${POSTGRES_PORT:-5432}
    command: ["python", "-u", "/app/smd_sync.py"]

  http-server:
    image: localhost/http-server:latest
    network_mode: host
    volumes:
      - ./configs/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./configs/boot.ipxe:/usr/share/nginx/html/boot.ipxe:ro
      - ../images:/usr/share/nginx/html/artifacts:ro

  tftp:
    image: localhost/tftp:latest
    network_mode: host

  redfish-emulator:
    image: localhost/redfish-emulator:latest
    network_mode: host
    profiles:
      - emulator
    environment:
      VM_INDEX: "0"
    command: ["python", "-u", "-c", "import os; idx=os.environ.get('VM_INDEX','0'); script=open('/emulator.py').read(); script=script.replace('INDEX = int(HOSTNAME.split(\"-\")[-1])', f'INDEX = {idx}'); exec(script)"]
    volumes:
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock

  kea-ctrl-agent:
    image: jonasal/kea-ctrl-agent:3.1.4
    network_mode: host
    pid: "service:kea"
    profiles:
      - stork
    depends_on:
      kea:
        condition: service_started
    volumes:
      - ./configs/kea-ctrl-agent.conf:/etc/kea/kea-ctrl-agent.conf:ro
      - kea-run:/kea/sockets
    command: ["-c", "/etc/kea/kea-ctrl-agent.conf"]

  stork-server:
    image: signalorange/stork:ubuntu24.04-1.19.0
    network_mode: host
    profiles:
      - stork
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./configs/stork-server.env:/etc/stork/server.env:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${STORK_PORT:-28010}/api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  stork-agent:
    image: localhost/stork-agent:latest
    network_mode: host
    pid: "service:kea"
    profiles:
      - stork
    cap_add:
      - SYS_PTRACE
    depends_on:
      kea:
        condition: service_started
      kea-ctrl-agent:
        condition: service_started
      stork-server:
        condition: service_healthy
    environment:
      STORK_AGENT_SERVER_URL: "http://localhost:${HTTP_PORT:-80}"
      STORK_AGENT_HOST: "${HOST_IP:-127.0.0.1}"
      STORK_AGENT_PORT: "${STORK_AGENT_PORT:-28011}"
    volumes:
      - ./configs/kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
      - ./configs/kea-ctrl-agent.conf:/etc/kea/kea-ctrl-agent.conf:ro
      - kea-run:/kea/sockets

volumes:
  postgres-data:
  kea-run:
