services:
  postgres:
    image: postgres:11.5-alpine
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ochami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEME}
      POSTGRES_MULTIPLE_DATABASES: "${SMD_DB_NAME:-hmsds}:${SMD_DB_USER:-smd-user}:${SMD_DB_PASSWORD:-CHANGEME},${BSS_DB_NAME:-bssdb}:${BSS_DB_USER:-bss-user}:${BSS_DB_PASSWORD:-CHANGEME},${KEA_DB_NAME:-kea}:${KEA_DB_USER:-kea-user}:${KEA_DB_PASSWORD:-CHANGEME}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./pg-init/multi-psql-db.sh:/docker-entrypoint-initdb.d/multi-psql-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ochami}"]
      interval: 5s
      timeout: 5s
      retries: 30

  smd-init:
    image: localhost/smd:local-smd
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SMD_DBHOST: localhost
      SMD_DBPORT: ${POSTGRES_PORT:-5432}
      SMD_DBNAME: ${SMD_DB_NAME:-hmsds}
      SMD_DBUSER: ${SMD_DB_USER:-smd-user}
      SMD_DBPASS: ${SMD_DB_PASSWORD:-CHANGEME}
      SMD_DBOPTS: "sslmode=disable"
    command: ["/smd-init"]
    restart: "no"

  smd:
    image: localhost/smd:local-smd
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      smd-init:
        condition: service_completed_successfully
    environment:
      SMD_DBHOST: localhost
      SMD_DBPORT: ${POSTGRES_PORT:-5432}
      SMD_DBNAME: ${SMD_DB_NAME:-hmsds}
      SMD_DBUSER: ${SMD_DB_USER:-smd-user}
      SMD_DBPASS: ${SMD_DB_PASSWORD:-CHANGEME}
      SMD_DBOPTS: "sslmode=disable"
      SMD_JWKS_URL: ""
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${SMD_PORT:-27779}/hsm/v2/service/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  bss-init:
    image: localhost/bss:local-bss
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BSS_INSECURE: "true"
      BSS_DBHOST: localhost
      BSS_DBPORT: ${POSTGRES_PORT:-5432}
      BSS_DBNAME: ${BSS_DB_NAME:-bssdb}
      BSS_DBUSER: ${BSS_DB_USER:-bss-user}
      BSS_DBPASS: ${BSS_DB_PASSWORD:-CHANGEME}
      BSS_DBOPTS: "sslmode=disable"
    command: ["/usr/local/bin/bss-init"]
    restart: "no"

  bss:
    image: localhost/bss:local-bss
    network_mode: host
    depends_on:
      smd:
        condition: service_healthy
      bss-init:
        condition: service_completed_successfully
    environment:
      HSM_URL: "http://localhost:${SMD_PORT:-27779}"
      BSS_INSECURE: "true"
      BSS_DEBUG: "true"
      BSS_DBHOST: localhost
      BSS_DBPORT: ${POSTGRES_PORT:-5432}
      BSS_DBNAME: ${BSS_DB_NAME:-bssdb}
      BSS_DBUSER: ${BSS_DB_USER:-bss-user}
      BSS_DBPASS: ${BSS_DB_PASSWORD:-CHANGEME}
      BSS_DBOPTS: "sslmode=disable"
      BSS_JWKS_URL: ""
      BSS_IPXE_SERVER: ${HOST_IP:-192.168.100.2}
      BSS_CHAIN_PROTO: "http"
      BSS_ENDPOINT: "localhost"
      BSS_ADVERTISE_ADDRESS: ${HOST_IP:-192.168.100.2}
      NFD_URL: "http://${HOST_IP:-192.168.100.2}:${HTTP_PORT:-80}/hmi/v1/subscribe"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${BSS_PORT:-27778}/boot/v1/bootparameters || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  cloud-init:
    image: ghcr.io/openchami/cloud-init:v1.2.3
    network_mode: host
    depends_on:
      smd:
        condition: service_healthy
    command:
      - "/usr/local/bin/cloud-init-server"
      - "--listen"
      - "0.0.0.0:${CLOUD_INIT_PORT:-27777}"
      - "--smd-url"
      - "http://localhost:${SMD_PORT:-27779}"
      - "--cluster-name"
      - "ochami"
      - "--insecure"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${CLOUD_INIT_PORT:-27777}/cloud-init/version || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kea-init:
    image: jonasal/kea-admin:3.1.4
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "db-init"
      - "pgsql"
      - "-h"
      - "localhost"
      - "-P"
      - "${POSTGRES_PORT:-5432}"
      - "-u"
      - "${KEA_DB_USER:-kea-user}"
      - "-p"
      - "${KEA_DB_PASSWORD:-CHANGEME}"
      - "-n"
      - "${KEA_DB_NAME:-kea}"
    restart: "no"

  kea:
    image: jonasal/kea-dhcp4:3.1.4
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      kea-init:
        condition: service_completed_successfully
    volumes:
      - ./configs/kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
    command: ["-c", "/etc/kea/kea-dhcp4.conf"]

  kea-sidecar:
    image: python:3.9-slim
    network_mode: host
    depends_on:
      smd:
        condition: service_healthy
      kea-init:
        condition: service_completed_successfully
    environment:
      SMD_URL: "http://localhost:${SMD_PORT:-27779}"
      DB_NAME: ${KEA_DB_NAME:-kea}
      DB_USER: ${KEA_DB_USER:-kea-user}
      DB_PASS: ${KEA_DB_PASSWORD:-CHANGEME}
      DB_HOST: localhost
      DB_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - ./configs/smd_sync.py:/app/smd_sync.py:ro
    command: ["bash", "-c", "pip install psycopg2-binary requests && python /app/smd_sync.py"]

  http-server:
    image: localhost/http-server:latest
    network_mode: host
    volumes:
      - ./configs/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./configs/boot.ipxe:/usr/share/nginx/html/boot.ipxe:ro

  tftp:
    image: localhost/tftp:latest
    network_mode: host

  redfish-emulator:
    image: localhost/redfish-emulator:latest
    network_mode: host
    profiles:
      - emulator

volumes:
  postgres-data:
