# Custom values for PXE boot setup with Minikube on 192.168.100.2
#
# This configuration supports TWO boot modes:
#   1. Traditional PXE (bare metal / standard VM firmware):
#      DHCP → TFTP iPXE binary → iPXE → HTTP boot.ipxe → kernel
#   2. HTTP boot (VMs with iPXE ROM or clients that already have iPXE):
#      DHCP → HTTP boot.ipxe directly → kernel
#
# The coresmd plugin includes a built-in TFTP server with iPXE binaries.
# The bootloop plugin handles unknown nodes during discovery.

externalIp: "192.168.100.2"
dhcpStart: "192.168.100.100"
dhcpEnd: "192.168.100.200"
dhcpNetmask: "255.255.255.0"

# IP address for the TFTP server (usually same as externalIp)
tftpServerIp: "192.168.100.2"

# Boot script URL that iPXE will chainload to (after getting iPXE via TFTP)
# We use the BSS dynamic endpoint which requires the MAC address
bootScriptUrl: "http://192.168.100.2:30080/boot/v1/bootscript?mac=${net0/mac}"

# CoreDHCP/CoreSMD configuration
coredhcp:
  # Override default server_id, router, etc.
  server_id: "192.168.100.2"
  router: "192.168.100.2"
  dns: "8.8.8.8"
  netmask: "255.255.255.0"

  # Lease times and cache settings
  short_lease_time: "5m"    # Lease time for unknown/discovery nodes
  long_lease_time: "1h"      # Lease time for known/production nodes
  cache_interval: "30s"      # How often to refresh SMD cache

  # Bootloop plugin config for unknown/discovery nodes
  bootloop:
    storage_path: "/tmp/coredhcp.db"
    ip_pool_start: "192.168.100.100"
    ip_pool_end: "192.168.100.200"

# BSS (Boot Script Service) configuration
bss:
  ipxe:
    server: "192.168.100.2"    # IP of the HTTP server with boot artifacts
  advertise_address: "192.168.100.2:30080"  # Where BSS is accessible (via nginx proxy)

# Plugin chain (configured in coredhcp-configmap.yaml):
#
# 1. coresmd - Handles KNOWN nodes from SMD
#    - Checks if MAC is registered in SMD inventory
#    - If known: assigns production IP, serves boot script URL
#    - If unknown: passes to next plugin
#    - Built-in TFTP server for raw PXE clients
#
# 2. bootloop - Handles UNKNOWN nodes for discovery
#    - Assigns temporary IP from pool for network discovery
#    - Boots "default" (reboot) script or discovery image
#    - When node becomes known in SMD, sends NAK to force re-handshake
#    - Node then gets production IP from coresmd on next DHCP cycle
