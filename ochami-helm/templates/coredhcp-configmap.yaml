apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ochami-helm.fullname" . }}-coredhcp-config
  labels:
    {{- include "ochami-helm.labels" . | nindent 4 }}
data:
  config.yaml: |
{{- if .Values.coredhcp.customConfig }}
{{ tpl .Values.coredhcp.customConfig . | indent 4 }}
{{- else }}
    server4:
      listen: "0.0.0.0:67"
      plugins:
        #
        # Base CoreDHCP config - these must come FIRST
        #

        - server_id: {{ .Values.coredhcp.server_id | default .Values.externalIp | quote }}
        - dns: {{ .Values.coredhcp.dns | quote }}
        - router: {{ .Values.coredhcp.router | default .Values.externalIp | quote }}
        - netmask: {{ .Values.coredhcp.netmask | quote }}

        {{- $smdUrl := printf "http://%s-smd.%s.svc.cluster.local:%v" (include "ochami-helm.fullname" .) .Release.Namespace .Values.service.smd.port }}
        {{- $bootScriptUrl := .Values.bootScriptUrl | default (printf "http://%s:%v/boot.ipxe" .Values.externalIp (int (.Values.httpServer.service.nodePort | default 30080))) }}
        {{- $shortLease := .Values.coredhcp.short_lease_time | default "5m" }}
        {{- $longLease := .Values.coredhcp.long_lease_time | default "1h" }}
        {{- $cacheInterval := .Values.coredhcp.cache_interval | default "30s" }}

        #
        # coresmd plugin - handles KNOWN nodes registered in SMD
        # This must come BEFORE bootloop to check SMD first
        # Args: smd_url boot_script_base_url ca_cert_path cache_interval long_lease_time single_port_mode
        #
        # For nodes registered in SMD:
        #   - Provides production IP from SMD inventory
        #   - Serves boot script URL for iPXE clients
        #   - Built-in TFTP server for raw PXE clients (serves iPXE binaries)
        #
        # single_port_mode=true: TFTP server binds to port 69 only (no ephemeral ports)
        #
        - coresmd: {{ $smdUrl }} {{ $bootScriptUrl | trimSuffix "/boot.ipxe" }} "" {{ $cacheInterval }} {{ $longLease }} true

        #
        # bootloop plugin - handles UNKNOWN nodes for discovery
        # This is the "catch-all" for nodes not yet in SMD
        # Args: storage_path boot_script short_lease_time ip_pool_start ip_pool_end
        #
        # For unknown nodes:
        #   - Assigns temporary IP from pool
        #   - Boots discovery image (or "default" reboot script)
        #   - When node becomes known in SMD, sends NAK to trigger re-handshake
        #
        - bootloop: {{ .Values.coredhcp.bootloop.storage_path | default "/tmp/coredhcp.db" }} default {{ $shortLease }} {{ .Values.coredhcp.bootloop.ip_pool_start }} {{ .Values.coredhcp.bootloop.ip_pool_end }}
{{- end }}
